<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NMIS GrowHub Explorer</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1d1d1b;--muted:#6b6b66;--line:#e2e1dc;--accent:#2f6f5e;--accent-soft:#e3f0ec;--warn:#9a5b13;--bad:#b23b3b;--bad-soft:#f7e3e1;--warn-soft:#f6ecd9;
--w-label:#1d1d1b;--w-field:#fff;--w-field-b:#9aa3a0;--w-btn:#ecebe6;--w-sub:#f2f7f5;--w-sec:#fbfbf9;--code:#f3f2ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151614;--panel:#1d1f1c;--ink:#e8e7e2;--muted:#9c9b94;--line:#33352f;--accent:#7cc4ad;--accent-soft:#22332d;--warn:#e0a35a;--bad:#ec7b72;--bad-soft:#3a2321;--warn-soft:#3a2f1f;--w-label:#e8e7e2;--w-field:#232521;--w-field-b:#5b625f;--w-btn:#2c2e2a;--w-sub:#1f2a26;--w-sec:#191a18;--code:#232521}}
:root[data-theme="dark"]{--bg:#151614;--panel:#1d1f1c;--ink:#e8e7e2;--muted:#9c9b94;--line:#33352f;--accent:#7cc4ad;--accent-soft:#22332d;--warn:#e0a35a;--bad:#ec7b72;--bad-soft:#3a2321;--warn-soft:#3a2f1f;--w-label:#e8e7e2;--w-field:#232521;--w-field-b:#5b625f;--w-btn:#2c2e2a;--w-sub:#1f2a26;--w-sec:#191a18;--code:#232521}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0;font-weight:600}header .sub{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:4px 8px;border-radius:6px;cursor:pointer;font:inherit;font-size:12.5px}
.tabs .grp{white-space:nowrap;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 2px 0 10px;align-self:center}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.wrap{flex:1;display:flex;min-height:0}
aside{width:300px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);min-height:0}
aside input{margin:10px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
aside .opts{padding:0 12px 6px;color:var(--muted);font-size:12px}
#list{overflow:auto;flex:1}#list div{padding:5px 12px;cursor:pointer;border-left:3px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
#list div:hover{background:var(--accent-soft)}#list div.on{border-left-color:var(--accent);background:var(--accent-soft)}
#list .cap{color:var(--muted);font-size:11px;display:block}
main{flex:1;overflow:auto;padding:20px 24px;min-width:0}
h2{margin:0 0 4px;font-size:20px}h3{margin:24px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.meta{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:12px 0;font-size:13px}.meta b{color:var(--muted);font-weight:500}
a.lnk{color:var(--accent);cursor:pointer;text-decoration:none;border-bottom:1px dotted}
pre{background:var(--code);padding:10px 12px;border-radius:6px;overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;margin:0;white-space:pre-wrap;word-break:break-word}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}th{color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--bg)}
td code{font-size:11.5px;word-break:break-word}
.wf-scroll{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px}
.sec{position:relative;background:var(--w-sec);border-bottom:1px dashed var(--line);margin-bottom:2px}
.sec .sname{position:absolute;right:4px;top:2px;font-size:10px;color:var(--muted);z-index:2;background:var(--w-sec);padding:0 4px}
.c{position:absolute;overflow:hidden;font-size:11px;line-height:1.15;white-space:nowrap;text-overflow:ellipsis}
.c.Label{color:var(--w-label)}
.c.TextBox,.c.ComboBox,.c.ListBox{background:var(--w-field);border:1px solid var(--w-field-b);padding:1px 3px;color:var(--muted)}
.c.ComboBox::after{content:"▾";position:absolute;right:2px;top:0;color:var(--ink)}
.c.CommandButton{background:var(--w-btn);border:1px solid var(--w-field-b);border-radius:3px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.c.CheckBox::before{content:"☐ ";color:var(--ink)}
.c.Subform{background:var(--w-sub);border:1.5px dashed var(--accent);color:var(--accent);padding:3px;cursor:pointer;white-space:normal}
.c.Rectangle,.c.OptionGroup{border:1px solid var(--w-field-b)}.c.Line{border-top:1px solid var(--w-field-b)}
.c.TabControl{border:1px solid var(--w-field-b);color:var(--muted);padding:2px}.c.Page{display:none}
.c.Image,.c.ObjectFrame{border:1px dotted var(--w-field-b);color:var(--muted)}
.c:hover{outline:2px solid var(--accent);z-index:5}
.chips span{display:inline-block;padding:2px 8px;border:1px solid var(--line);border-radius:12px;margin:2px 4px 2px 0;font-size:12px}
.note{color:var(--muted);font-size:12.5px;max-width:900px}
.warn{color:var(--warn)}
.cols{columns:3 220px;font-size:12.5px}.cols div{break-inside:avoid;padding:1px 0}
#erd svg{max-width:none;height:auto}#erd.fit svg{max-width:100%!important;width:100%!important}
.menu{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px 14px;margin:0 0 12px;max-width:760px}
.menu h4{margin:0 0 6px}.menu li{margin:2px 0}
.toggle.on{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.toggle{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:3px 8px;cursor:pointer;font:inherit;font-size:12px}

.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:middle}
.badge.warn{border-color:var(--warn);color:var(--warn)}.badge.pk{border-color:var(--accent);color:var(--accent)}
.enumv{display:inline-block;font:11px ui-monospace,Menlo,monospace;background:var(--code);border-radius:4px;padding:0 5px;margin:1px 2px 1px 0}
details summary{cursor:pointer;color:var(--muted);font-size:12px}
.hist{font-size:11.5px;color:var(--muted)}.hist div{margin:1px 0}
#gerd{position:relative;overflow:hidden;height:calc(100vh - 230px);min-height:420px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:grab}
#gerd svg{position:absolute;left:0;top:0;width:100%;height:100%}
#gerd .tb rect.box{fill:var(--panel);stroke:var(--w-field-b)}#gerd .tb rect.hd{fill:var(--accent-soft);stroke:var(--w-field-b)}
#gerd .tb text{fill:var(--ink);font:11px ui-monospace,Menlo,monospace}#gerd .tb text.h{font:600 12px -apple-system,sans-serif}#gerd .tb text.t{fill:var(--muted)}
#gerd .tb{cursor:pointer}#gerd .tb:hover rect.box{stroke:var(--accent);stroke-width:2}
#gerd path.l{fill:none;stroke:var(--w-field-b);stroke-width:1.2}#gerd path.l.hl{stroke:var(--accent);stroke-width:2.4}#gerd path.l.audit{stroke-dasharray:3 3;opacity:.5}
#gerd .tb.dim{opacity:.25}#gerd path.l.dim{opacity:.08}
.mig{border-bottom:1px solid var(--line);padding:8px 0}.mig .mt{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.mig .md{color:var(--muted);font:12px ui-monospace,Menlo,monospace;min-width:84px}

.st{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;white-space:nowrap}
.st.yes{background:var(--accent-soft);color:var(--accent)}.st.maybe,.st.other{background:var(--warn-soft);color:var(--warn)}.st.no{background:var(--bad-soft);color:var(--bad)}.st.blank{color:var(--muted);border:1px dashed var(--line)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);min-width:120px}.bar span{display:block;height:100%}
.bar .yes{background:var(--accent)}.bar .maybe,.bar .other{background:var(--warn)}.bar .no{background:var(--bad)}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--panel);min-width:150px}.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.kpi span{color:var(--muted);font-size:12px}
tr.flag td{background:var(--bad-soft)}
.miss{color:var(--bad)}.sug{color:var(--muted);font-size:11.5px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.mapcell{font-size:11.5px}
.verb{display:inline-block;min-width:52px;font:600 11px ui-monospace,Menlo,monospace;padding:1px 6px;border-radius:4px;text-align:center;background:var(--code)}
.verb.GET{color:var(--accent)}.verb.POST{color:#3b6fb6}.verb.PUT,.verb.PATCH{color:var(--warn)}.verb.DELETE{color:var(--bad)}
.stamp{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:6px 10px;display:inline-block;margin:4px 0 10px;background:var(--panel)}
.tree td:first-child{white-space:nowrap}
.vd{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;white-space:nowrap}
.vd.matches{background:var(--accent-soft);color:var(--accent)}.vd.differs,.vd.needs{background:var(--warn-soft);color:var(--warn)}.vd.missing,.vd.legacy{background:var(--bad-soft);color:var(--bad)}.vd.growhub{border:1px solid var(--line);color:var(--muted)}
.sev{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.sev.high{color:var(--bad);font-weight:600}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}.cmp>div{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--panel);min-width:0}
.cmp h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}.cmp .f{white-space:pre-wrap;margin-bottom:10px}
.cmp pre{margin:4px 0 10px;white-space:pre;overflow:auto;max-height:420px;word-break:normal}.where{font:11px ui-monospace,Menlo,monospace;color:var(--muted)}
.callout{border-left:3px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:12px 0}
@media (max-width:900px){.cmp{grid-template-columns:1fr}}
@media (max-width:760px){.wrap{flex-direction:column}aside{width:auto;max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}main{padding:16px}header{flex-wrap:wrap}}
</style></head><body>
<header><div><h1>NMIS → GrowHub Explorer</h1><div class="sub" id="stats"></div></div>
<div class="tabs" id="tabs"><span class="grp">Legacy Access</span><button data-t="Form" class="on">Forms</button><button data-t="Report">Reports</button><button data-t="Table">Tables</button><button data-t="ERD">ERD</button><button data-t="Menus">Menus</button><span class="grp">GrowHub frontend</span><button data-t="GScr">Screens</button><button data-t="FForm">Forms</button><button data-t="FReq">Requests</button><span class="grp">GrowHub backend</span><button data-t="BEnd">Endpoints</button><button data-t="GTable">Tables</button><button data-t="GERD">ERD</button><button data-t="GMig">Migrations</button><span class="grp">Migration</span><button data-t="Map">Mapping</button><button data-t="Rules">Business rules</button><button data-t="Ref">Reference data</button><button class="toggle" id="theme" title="Toggle theme">◐</button></div></header>
<div class="wrap"><aside><input id="q" placeholder="Search names, captions, sources…"><div class="opts"><label>Show <select id="show" style="font:inherit;font-size:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px"><option value="reach">reachable from the menus</option><option value="nocopy">all except old copies</option><option value="all">everything</option></select></label><input type="checkbox" id="hideOld" checked style="display:none"></div><div id="list"></div></aside><main id="main"></main></div>
<script id="data" type="application/json">__DATA__</script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const items=D.items, T=D.erd.tables, R=D.erd.relationships, G=D.growhub, GT=G.tables;
const isMeta=c=>/^metadata/.test(c);
const MP=D.mapping, MROWS=MP.domains.flatMap(d=>d.sections.flatMap(s=>s.rows.map(r=>({...r,sheet:d.sheet}))));
const ghIdx={}, lgIdx={};
MROWS.forEach(r=>{if(r.gh){((ghIdx[r.gh.table]=ghIdx[r.gh.table]||{})[r.gh.column]=ghIdx[r.gh.table][r.gh.column]||[]).push(r);}
  (r.legacy||[]).forEach(l=>{((lgIdx[l.table]=lgIdx[l.table]||{})[l.column]=lgIdx[l.table][l.column]||[]).push(r);});});
const ST={yes:'approved',maybe:'maybe',no:'not approved',other:'see note',blank:'not reviewed'};
const stChip=(s,label)=>`<span class="st ${s.state}" title="${esc((label?label+': ':'')+(s.text||ST[s.state]))}">${esc(label?label+' '+(s.state==='blank'?'—':s.text||ST[s.state]):s.text||ST[s.state])}</span>`;
const byKey={};items.forEach(i=>byKey[i.kind+':'+i.name]=i);
let tab='Form',sel=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isOld=n=>/^[*x~]|old|_bu\b|_bu\d|backup|^copy of/i.test(n);
document.getElementById('stats').textContent=`Legacy: ${items.filter(i=>i.kind==='Form').length} forms · ${items.filter(i=>i.kind==='Report').length} reports · ${Object.keys(T).length} tables   |   GrowHub: ${Object.keys(GT).length} tables · ${G.migrations.length} migrations`;
document.querySelectorAll('#tabs button[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('#tabs button[data-t]').forEach(x=>x.classList.toggle('on',x===b));sel=null;renderList();renderMain();});
document.getElementById('theme').onclick=()=>{const r=document.documentElement;const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark';if(tab==='ERD'||tab==='Table')renderMain();};
document.getElementById('q').oninput=renderList;document.getElementById('hideOld').onchange=renderList;document.getElementById('show').onchange=renderList;
const RCH=D.reach.objects, isReach=i=>RCH[i.kind+':'+i.name]?.reachable;
// ---- GrowHub frontend screens (one per route component) ----
const FE=D.fe, SCR={};
FE.routes.forEach(r=>{if(!r.fieldCount&&!r.tables.length&&!r.endpoints.length)return;(SCR[r.component]=SCR[r.component]||{...r,paths:[]}).paths.push(r.path);});
const scrIdx={};  // table -> column -> [component]
for(const [cn,s] of Object.entries(SCR)){for(const c of s.components){for(const ctl of FE.components[c].controls)for(const h of ctl.gh){((scrIdx[h.table]=scrIdx[h.table]||{})[h.column]=scrIdx[h.table][h.column]||new Set()).add(cn);}}}
const sref=cn=>SCR[cn]?`<a class="lnk" data-go="W:${esc(cn)}">${esc(SCR[cn].paths[0])}</a>`:esc(cn);
function screensFor(rows){const c={};rows.forEach(r=>{if(!r.gh)return;for(const s of ((scrIdx[r.gh.table]||{})[r.gh.column]||[]))c[s]=(c[s]||0)+1;});return Object.entries(c).sort((a,b)=>b[1]-a[1]);}
function listEntries(){
  const q=document.getElementById('q').value.toLowerCase(),hide=document.getElementById('hideOld').checked;
  const show=document.getElementById('show').value;
  if(tab==='Form'||tab==='Report') return items.filter(i=>i.kind===tab&&(show==='all'||(show==='reach'?isReach(i):!isOld(i.name)))&&(!q||(i.name+' '+(i.caption||'')+' '+(i.recordSource||'')).toLowerCase().includes(q))).map(i=>({k:i.kind+':'+i.name,n:i.name,c:i.caption||''}));
  if(tab==='Table') return Object.keys(T).sort().filter(t=>(!hide||!t.startsWith('*'))&&(!q||(t+' '+T[t].columns.join(' ')).toLowerCase().includes(q))).map(t=>({k:'T:'+t,n:t,c:T[t].columns.length+' columns seen'}));
  if(tab==='GTable') return Object.keys(GT).sort().filter(n=>(!hide||!['migrations','typeorm_metadata','cycle_index_backup_fractional'].includes(n))&&(!q||(n+' '+GT[n].columns.map(c=>c.name).join(' ')).toLowerCase().includes(q))).map(n=>{const g=GT[n];const c=g.columns.filter(c=>!isMeta(c.name)).length;const cr=G.migrations.find(m=>m.file===g.createdIn);return {k:'G:'+n,n:n+(g.entity?'':' ⚠'),c:`${c} columns${cr?' · created '+cr.date:''}${g.entity?'':' · no entity in code'}`};});
  if(tab==='Map') return MP.domains.flatMap(d=>d.sections.filter(s=>!q||(d.sheet+' '+s.name+' '+(s.table||'')+' '+s.rows.map(r=>r.field+' '+r.accessField).join(' ')).toLowerCase().includes(q)).map(s=>{const ap=s.rows.filter(r=>r.approved.state==='yes').length;return {k:'S:'+d.sheet+'|'+s.name,n:d.sheet+' › '+s.name,c:`${s.table||'?'} · ${ap}/${s.rows.length} approved${s.rows.some(r=>r.field&&s.table&&!r.gh)?' · ⚠ fields not in schema':''}`};}));
  if(tab==='Rules') return (D.rules||[]).flatMap(d=>d.rules.filter(r=>!q||(r.id+' '+r.title+' '+r.verdict+' '+(r.impact||'')).toLowerCase().includes(q)).map(r=>({k:'B:'+r.id,n:r.id+' · '+r.title,c:d.domain+' · '+r.verdict+(r.severity&&r.severity!=='info'?' · '+r.severity:'')})));
  if(tab==='Ref') return [['R:enums','Enum value mappings',MP.enums.length+' tables from SourceENUM'],['R:acc','Activity codes (Access)',MP.activityCodes.access.length+' codes across nurseries'],['R:ora','Activity codes (Oracle → GrowHub)',MP.activityCodes.oracle.length+' codes'],['R:units','Grow units',MP.growUnits.units.length+' Access units · '+MP.growUnits.desired.length+' target codes'],['R:boxes','Ship / storage box types',MP.boxTypes.length+' units']].filter(e=>!q||e[1].toLowerCase().includes(q)).map(e=>({k:e[0],n:e[1],c:e[2]}));
  if(tab==='FForm') return FORMS.filter(f=>!q||(f.comp+' '+f.name+' '+flat(f.fields).map(x=>x.name).join(' ')).toLowerCase().includes(q)).map(f=>({k:'F:'+f.key,n:f.name.replace('returned by ','')+' · '+f.comp.replace(/Component$/,''),c:`${flat(f.fields).length} fields · ${f.requests.length} requests`}));
  if(tab==='FReq') return FE.requests.map((r,ix)=>({r,ix})).filter(({r})=>!q||(r.service+' '+r.method+' '+r.url+' '+(r.endpoint||'')).toLowerCase().includes(q)).map(({r,ix})=>({k:'Q:'+ix,n:r.verb+' '+r.url.replace(/^\/api/,''),c:`${r.service}.${r.method}${r.endpoint?'':' · ⚠ no backend route'}`}));
  if(tab==='BEnd') return BE.endpoints.map((e,ix)=>({e,ix})).filter(({e})=>!q||(e.verb+' '+e.path+' '+(e.handler.function||'')+' '+(e.handler.tables||[]).join(' ')).toLowerCase().includes(q)).map(({e,ix})=>({k:'E:'+ix,n:e.verb+' '+e.path.replace(/^\/api/,''),c:`${e.handler.function||'?'} · ${(reqByEp[epKey(e)]||[]).length} frontend requests`}));
  if(tab==='GScr') return Object.entries(SCR).sort((a,b)=>a[1].paths[0].localeCompare(b[1].paths[0])).filter(([cn,s])=>!q||(s.paths.join(' ')+' '+cn).toLowerCase().includes(q)).map(([cn,s])=>({k:'W:'+cn,n:s.paths[0],c:`${cn} · ${s.fieldCount} fields`}));
  if(tab==='GMig') return G.migrations.slice().reverse().filter(m=>!q||(m.name+' '+m.tables.join(' ')).toLowerCase().includes(q)).map(m=>({k:'M:'+m.file,n:m.name,c:m.date+' · '+m.tables.join(', ')}));
  return [];
}
function renderList(){
  const L=document.getElementById('list');const es=listEntries();
  L.innerHTML=es.length?es.map(e=>`<div data-k="${esc(e.k)}" class="${e.k===sel?'on':''}">${esc(e.n)}<span class="cap">${esc(e.c)}</span></div>`).join(''):`<div style="color:var(--muted);cursor:default">${['ERD','Menus','GERD'].includes(tab)?'—':'No matches'}</div>`;
  L.querySelectorAll('div[data-k]').forEach(d=>d.onclick=()=>go(d.dataset.k));
}
function go(k){

  <div class="kpis"><div class="kpi"><b>${R.length}</b><span>mapped fields</span></div><div class="kpi"><b>${cnt(r=>r.approved.state==='yes')}</b><span>approved for migration work</span></div><div class="kpi"><b>${cnt(r=>r.validated.state==='yes')}</b><span>validated</span></div><div class="kpi"><b>${cnt(r=>r.final.state==='yes')}</b><span>final approval</span></div><div class="kpi"><b style="color:var(--bad)">${missing.length}</b><span>fields not in GrowHub schema</span></div></div>
  <h3>Progress by section</h3><table><thead><tr><th>Section</th><th>GrowHub table</th><th>Fields</th><th style="width:40%">Approval</th><th>Not in schema</th><th>No Access source</th></tr></thead><tbody>`+
  MP.domains.flatMap(d=>d.sections.map(s=>{const rs=s.rows.map(r=>({...r,sheet:d.sheet}));return `<tr><td><a class="lnk" data-go="S:${esc(d.sheet+'|'+s.name)}">${esc(d.sheet)} › ${esc(s.name)}</a></td><td>${s.table?gref(s.table):'?'}</td><td>${rs.length}</td><td>${bar(rs)}</td><td>${rs.filter(r=>r.field&&r.table&&!r.gh).length||''}</td><td>${rs.filter(r=>r.field&&!r.accessTables&&!r.accessField).length||''}</td></tr>`;})).join('')+`</tbody></table>
  <p class="note">The workbook doesn't name a GrowHub table for each section, so I matched them by section name (for example Ship Ticket → <code>source_shipment</code>, Planning → <code>order_cycle_planning</code>). Tell me if any are wrong.</p>
  <h3>GrowHub fields that don't exist in the schema (${missing.length})</h3><p class="note">The sheet names a field the target table doesn't have. Usually it was renamed or moved in a later migration (the pack/storage summary restructure, ship ticket → <code>source_shipment</code>).</p><div style="overflow:auto"><table>${MHEAD(1)}<tbody>${missing.map(r=>mapRow(r,1)).join('')}</tbody></table></div>
  <h3>Flagged, maybe or not approved (${flagged.length})</h3><div style="overflow:auto"><table>${MHEAD(1)}<tbody>${flagged.map(r=>mapRow(r,1)).join('')}</tbody></table></div>
  <h3>GrowHub columns with no row in the sheet</h3><p class="note">Columns on the mapped tables that no row covers. IDs, audit columns and the legacy columns are left out.</p><table><thead><tr><th>Table</th><th>Mapped</th><th>Not covered</th></tr></thead><tbody>${Object.entries(MP.coverage).map(([tb,c])=>`<tr><td>${gref(tb)}</td><td>${c.mapped.length}</td><td class="mapcell">${c.unmapped.map(x=>(c.unmappedFks.includes(x)?'↗':'')+esc(x)).join(', ')||'—'}</td></tr>`).join('')}</tbody></table>`;
  const cov=allCoverage().filter(x=>isReach(x.i)).sort((a,b)=>b.mapped-a.mapped).slice(0,40);
  h+=`<h3>Legacy screens by mapping coverage</h3><p class="note">For each legacy form reachable from the menus, how many of its bound fields trace to a mapped Access column. Only fields Access binds directly are counted, so calculated controls aren't included.</p><table><thead><tr><th>Form</th><th>Caption</th><th>Bound fields</th><th>Mapped</th><th>Approved</th><th style="width:22%">Coverage</th><th>Main GrowHub screen</th></tr></thead><tbody>${cov.map(x=>{const sc=screensFor(x.rows);return `<tr><td>${ref('Form:'+x.i.name)}</td><td>${esc(x.i.caption||'')}</td><td>${x.bound}</td><td>${x.mapped}</td><td>${x.approved}</td><td><div class="bar"><span class="yes" style="width:${x.approved/x.bound*100}%"></span><span class="maybe" style="width:${(x.mapped-x.approved)/x.bound*100}%"></span></div></td><td>${sc.length?sref(sc[0][0])+' <span class="hist">'+sc[0][1]+' fields</span>':'<span class="hist">—</span>'}</td></tr>`;}).join('')}</tbody></table>`;
  M.innerHTML=h;bindLinks(M);
}
let mapFilter='all';
function renderMapSection(M,key){
  const [sheet,secn]=key.split('|');const d=MP.domains.find(x=>x.sheet===sheet);const s=d&&d.sections.find(x=>x.name===secn);if(!s){M.innerHTML='?';return;}
  const rows=s.rows.map(r=>({...r,sheet}));
  const F={all:r=>1,yes:r=>r.approved.state==='yes',open:r=>r.approved.state!=='yes',schema:r=>r.field&&r.table&&!r.gh,nosrc:r=>r.field&&!r.accessTables&&!r.accessField};
  const shown=rows.filter(F[mapFilter]);
  const cov=s.table&&MP.coverage[s.table];
  let h=`<h2>${esc(sheet)} › ${esc(s.name)}</h2><div style="color:var(--muted)">→ ${s.table?gref(s.table):'no table matched'} · ${rows.length} fields</div><div style="margin:10px 0;max-width:520px">${bar(rows)}</div>
  <div class="filters">${[['all','All'],['yes','Approved'],['open','Not yet approved'],['schema','Not in schema'],['nosrc','No Access source']].map(([k,l])=>`<button class="toggle${mapFilter===k?' on':''}" data-f="${k}">${l} (${rows.filter(F[k]).length})</button>`).join('')}</div>
  <div style="overflow:auto"><table>${MHEAD(0)}<tbody>${shown.map(r=>mapRow(r,0)).join('')}</tbody></table></div>`;
  if(cov&&cov.unmapped.length)h+=`<h3>Columns on ${esc(s.table)} with no row in the sheet</h3><div class="chips">${cov.unmapped.map(c=>'<span>'+esc(c)+'</span>').join('')}</div>`;
  M.innerHTML=h;bindLinks(M);M.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{mapFilter=b.dataset.f;renderMapSection(M,key);});
}
let refNur='all',refOnly=false;
function renderRef(M,k){
  let h='';const tbl=(head,rows)=>`<div style="overflow:auto"><table><thead><tr>${head.map(x=>'<th>'+x+'</th>').join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
  const nurPick=(list)=>{const ns=[...new Set(list.map(x=>x.nursery))].filter(Boolean).sort();return `<div class="filters">${['all',...ns].map(n=>`<button class="toggle${refNur===n?' on':''}" data-n="${esc(n)}">${n==='all'?'All nurseries':esc(n)}</button>`).join('')}<label style="margin-left:10px"><input type="checkbox" id="refonly"${refOnly?' checked':''}> only rows without a GrowHub mapping</label></div>`;};
  if(k==='R:enums'){h=`<h2>Enum value mappings</h2><p class="note">From the <code>SourceENUM</code> sheet. Rows in the field mapping link straight to these.</p>`+MP.enums.map(e=>`<h3>${esc(e.access)} → ${esc(e.growhub||'?')}</h3>`+tbl(['Access value','GrowHub value'],e.values.map(v=>`<tr><td><code>${esc(v.access)}</code></td><td>${v.growhub?esc(v.growhub):'<span class="miss">—</span>'}</td></tr>`))).join('');}
  if(k==='R:acc'){const all=MP.activityCodes.access;const rs=all.filter(a=>(refNur==='all'||a.nursery===refNur)&&(!refOnly||!(a.ghCode||a.ghParent)));const m=all.filter(a=>a.ghCode||a.ghParent).length;
    h=`<h2>Activity codes (Access)</h2><p class="note">${all.length} nursery activity codes. ${m} have a GrowHub parent or code (${Math.round(m/all.length*100)}%).</p>`+nurPick(all)+tbl(['Nursery','Code','Name','Parent','Balance','Module','GrowHub parent','GrowHub code','Note'],rs.map(a=>`<tr><td>${esc(a.nursery)}</td><td><code>${esc(a.code)}</code></td><td>${esc(a.name)}</td><td>${esc(a.parentCode)}</td><td>${esc(a.balance)}</td><td>${esc(a.module)}</td><td>${a.ghParent?esc(a.ghParent):'<span class="hist">—</span>'}</td><td>${esc(a.ghCode)}</td><td class="mapcell">${esc(a.note)}</td></tr>`));}
  if(k==='R:ora'){const rs=MP.activityCodes.oracle.filter(a=>!refOnly||!a.ghParent);h=`<h2>Activity codes (Oracle → GrowHub)</h2><div class="filters"><label><input type="checkbox" id="refonly"${refOnly?' checked':''}> only rows without a GrowHub parent</label></div>`+tbl(['Code','Name','GrowHub parent','GrowHub code','Source/Seedling','Balance effect'],rs.map(a=>`<tr><td><code>${esc(a.code)}</code></td><td>${esc(a.name)}</td><td>${a.ghParent?esc(a.ghParent):'<span class="hist">—</span>'}</td><td>${esc(a.ghCode)}</td><td>${esc(a.kind)}</td><td>${esc(a.balance)}</td></tr>`));}
  if(k==='R:units'){const U=MP.growUnits;const rs=U.units.filter(u=>(refNur==='all'||u.nursery===refNur)&&(!refOnly||!u.ghCode));
    h=`<h2>Grow units</h2><p class="note">Access <code>NMIS_UNITS</code> per nursery, with the GrowHub code from the sheet's first migration attempt and SME approval. GrowHub table: ${gref('grow_unit')}.</p>`+nurPick(U.units)+tbl(['Nursery','Access code','Type','Description','Cells/cont.','GrowHub code','SME approval'],rs.map(u=>`<tr><td>${esc(u.nursery)}</td><td><code>${esc(u.code)}</code></td><td>${esc(u.type)}</td><td>${esc(u.description)}<div class="hist">${esc(u.cellDims)}</div></td><td>${esc(u.cellsPerContainer??'')}</td><td>${u.ghCode&&u.ghCode!=='#N/A'?'<code>'+esc(u.ghCode)+'</code>':'<span class="miss">'+esc(u.ghCode||'—')+'</span>'}</td><td>${stChip(u.approved)}</td></tr>`))+
      `<h3>Target GrowHub grow-unit codes (${U.desired.length})</h3>`+tbl(['Current Access code(s)','GrowHub code','Description','Stock type','Cell dia × depth','Cells/cont.','W × L × H','Drill rows','Historical'],U.desired.map(u=>`<tr><td><code>${esc(u.current)}</code></td><td><code>${esc(u.desired)}</code></td><td>${esc(u.description)}</td><td>${esc(u.stockType)}</td><td>${esc(u.cellDiameter??'')} × ${esc(u.cellDepth??'')}</td><td>${esc(u.cellsPerContainer??'')}</td><td>${[u.width,u.length,u.height].map(x=>esc(x??'')).join(' × ')}</td><td>${esc(u.drillRows??'')}</td><td>${esc(u.historical)}</td></tr>`))+
      `<h3>Species products with new or mismatched grow units (${U.mismatched.length})</h3>`+tbl(['Value','Nursery','First product CN'],U.mismatched.map(u=>`<tr><td><code>${esc(u.value)}</code></td><td>${esc(u.nursery)}</td><td><code>${esc(u.firstProduct)}</code></td></tr>`));}
  if(k==='R:boxes'){const rs=MP.boxTypes.filter(b=>refNur==='all'||b.nursery===refNur);h=`<h2>Ship / storage box types</h2>`+nurPick(MP.boxTypes)+tbl(['Nursery','Code','Type','Multiplier','Description','Cells/cont.','Note'],rs.map(b=>`<tr><td>${esc(b.nursery)}</td><td><code>${esc(b.code)}</code></td><td>${esc(b.type)}</td><td>${esc(b.multiplier??'')}</td><td>${esc(b.description)}</td><td>${esc(b.cellsPerContainer??'')}</td><td class="mapcell">${esc(b.notes)}</td></tr>`));}
  M.innerHTML=h;bindLinks(M);
  M.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{refNur=b.dataset.n;renderRef(M,k);});
  const ro=M.querySelector('#refonly');if(ro)ro.onchange=()=>{refOnly=ro.checked;renderRef(M,k);};
}
function formCoverage(i){let b=0,m=0;const hits=[],rows=[];for(const s of i.sections)for(const c of s.controls){const f=(c.ControlSource||'').replace(/^\[|\]$/g,'');if(!f||f.startsWith('='))continue;b++;
  for(const tb of [...Object.keys(i.fieldLists||{}),...(i.tablesUsed||[])]){if((i.fieldLists[tb]||T[tb]?.columns||[]).includes(f)&&(lgIdx[tb]||{})[f]){m++;rows.push(...lgIdx[tb][f]);if(lgIdx[tb][f].some(r=>r.approved.state==='yes'))hits.push(f);break;}}}
  return {bound:b,mapped:m,approved:hits.length,rows};}
let _cov=null;const allCoverage=()=>_cov||(_cov=items.filter(i=>i.kind==='Form'&&!i.error).map(i=>({i,...formCoverage(i)})).filter(x=>x.mapped));
function ghMapCell(table,col){const rs=(ghIdx[table]||{})[col];if(!rs)return '';return rs.map(r=>`<div class="mapcell" style="min-width:150px">${r.accessField?'<span title="'+esc(r.accessTables)+'">'+esc(r.accessField)+'</span>':'<span class="hist">no source</span>'} ${stChip(r.approved)} <a class="lnk" data-go="S:${esc(r.sheet+'|'+r.section)}" title="open in mapping">›</a></div>`).join('');}
function lgMapCell(table,col){const rs=(lgIdx[table]||{})[col];if(!rs)return '';return rs.map(r=>{const sc=r.gh?[...((scrIdx[r.gh.table]||{})[r.gh.column]||[])]:[];return `<span class="mapcell">→ ${r.gh?gref(r.gh.table)+'.'+esc(r.gh.column):'<span class="miss">'+esc(r.field||'?')+'</span>'} ${stChip(r.approved)}${sc.length?' <span class="hist">on</span> '+sc.slice(0,2).map(sref).join(', '):r.gh?' <span class="hist">(not on a screen)</span>':''}</span>`;}).join(' ');}
